<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ShopEasy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Simplified Nav -->
    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container justify-content-center">
            <a class="brand-logo" href="index.html">
                <i class="bi bi-bag-heart-fill"></i>
                Shop<span>Easy</span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border rounded-4 shadow-sm bg-white p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold fs-3 text-dark">Welcome Back</h1>
                        <p class="text-muted small">Sign in to your ShopEasy account to continue</p>
                    </div>

                    <!-- Quick Demo Credentials Box -->
                    <div class="p-3 bg-light border rounded-3 mb-4">
                        <div class="small fw-bold text-secondary mb-2 text-uppercase">
                            <i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Fill:
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary flex-grow-1" onclick="fillDemoCustomer()">
                                Demo Customer
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-dark flex-grow-1" onclick="fillDemoAdmin()">
                                Demo Admin
                            </button>
                        </div>
                    </div>

                    <!-- Login Form -->
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label for="login-email" class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                                <input type="email" id="login-email" class="form-control border-start-0" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="login-password" class="form-label small fw-bold text-muted text-uppercase mb-0">Password</label>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                                <input type="password" id="login-password" class="form-control border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="login-btn" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3 shadow">
                            Sign In to Account
                        </button>
                    </form>

                    <div class="text-center small text-muted">
                        Don't have an account yet? 
                        <a href="register.html" class="fw-bold text-primary text-decoration-none ms-1">Create one here</a>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
