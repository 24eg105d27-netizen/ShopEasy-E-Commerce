<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products — ShopEasy Catalog</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <i class="bi bi-bag-heart-fill"></i>
                Shop<span>Easy</span>
            </a>

            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="products.html" class="nav-link fw-bold text-primary">Catalog</a>
                
                <a href="cart.html" class="cart-icon-btn" title="View Shopping Cart">
                    <i class="bi bi-cart3 fs-4"></i>
                    <span id="navbar-cart-count" class="cart-badge" style="display: none;">0</span>
                </a>

                <div id="navbar-auth-actions" class="d-flex align-items-center gap-2">
                    <a href="login.html" class="btn btn-outline-custom">Sign In</a>
                    <a href="register.html" class="btn btn-primary-custom d-none d-sm-inline-block">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Products</li>
            </ol>
        </nav>

        <div class="row">
            <!-- Sidebar Filters -->
            <aside class="col-lg-3 mb-4">
                <div class="card border p-3 rounded-3 shadow-sm bg-white sticky-top" style="top: 80px; z-index: 10;">
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
                        <h5 class="fw-bold mb-0 fs-6"><i class="bi bi-funnel me-1"></i> Filters</h5>
                        <button class="btn btn-sm btn-link text-decoration-none p-0" onclick="resetFilters()">Reset All</button>
                    </div>

                    <!-- Categories Filter -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Category</label>
                        <div id="category-filter-list">
                            <!-- Populated dynamically -->
                            <div class="spinner-loading" style="width: 1.2rem; height: 1.2rem;"></div>
                        </div>
                    </div>

                    <!-- Price Range Filter -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Price Range</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="priceRadio" id="price-all" checked onchange="onPriceChange(null, null)">
                            <label class="form-check-label" for="price-all">All Prices</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="priceRadio" id="price-under-1k" onchange="onPriceChange(0, 1000)">
                            <label class="form-check-label" for="price-under-1k">Under ₹1,000</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="priceRadio" id="price-1k-5k" onchange="onPriceChange(1000, 5000)">
                            <label class="form-check-label" for="price-1k-5k">₹1,000 – ₹5,000</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="priceRadio" id="price-5k-20k" onchange="onPriceChange(5000, 20000)">
                            <label class="form-check-label" for="price-5k-20k">₹5,000 – ₹20,000</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="priceRadio" id="price-above-20k" onchange="onPriceChange(20000, null)">
                            <label class="form-check-label" for="price-above-20k">Above ₹20,000</label>
                        </div>
                    </div>

                    <!-- Quick Guarantee Box -->
                    <div class="p-3 bg-light rounded-3 small text-muted">
                        <i class="bi bi-shield-check text-success fs-6 me-1"></i>
                        All products verified with 100% genuine warranty and 7-day easy returns.
                    </div>
                </div>
            </aside>

            <!-- Product Grid Area -->
            <section class="col-lg-9">
                <!-- Search & Sort Header -->
                <div class="card border p-3 rounded-3 shadow-sm bg-white mb-4">
                    <div class="row align-items-center g-3">
                        <div class="col-md-6">
                            <form onsubmit="onSearchInput(event)" class="position-relative">
                                <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                                <input type="text" id="catalog-search-input" class="form-control ps-5" placeholder="Search by name, brand, or features...">
                            </form>
                        </div>
                        <div class="col-md-6 d-flex align-items-center justify-content-md-end gap-3">
                            <span id="products-count" class="text-muted small fw-semibold">Loading products...</span>
                            <div class="d-flex align-items-center gap-2">
                                <label for="sort-select" class="small text-muted fw-bold text-nowrap">Sort:</label>
                                <select id="sort-select" class="form-select form-select-sm" style="min-width: 140px;" onchange="onSortChange(this.value)">
                                    <option value="newest">Newest First</option>
                                    <option value="price_asc">Price: Low to High</option>
                                    <option value="price_desc">Price: High to Low</option>
                                    <option value="name_asc">Name: A to Z</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Product Grid -->
                <div class="row" id="products-grid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-loading"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Professional E-Commerce Footer -->
    <footer class="footer-custom">
        <div class="container text-center small text-secondary">
            &copy; 2026 ShopEasy Inc. Full Stack Java 21 & Spring Boot Project.
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
