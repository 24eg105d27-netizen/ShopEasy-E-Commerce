<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ShopEasy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Simplified Nav -->
    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container justify-content-center">
            <a class="brand-logo" href="index.html">
                <i class="bi bi-bag-heart-fill"></i>
                Shop<span>Easy</span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border rounded-4 shadow-sm bg-white p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold fs-3 text-dark">Join ShopEasy</h1>
                        <p class="text-muted small">Create an account to start shopping and tracking your orders</p>
                    </div>

                    <!-- Registration Form -->
                    <form onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label for="register-name" class="form-label small fw-bold text-muted text-uppercase">Full Name *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                                <input type="text" id="register-name" class="form-control border-start-0" placeholder="Rahul Sharma" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register-email" class="form-label small fw-bold text-muted text-uppercase">Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                                <input type="email" id="register-email" class="form-control border-start-0" placeholder="rahul@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register-phone" class="form-label small fw-bold text-muted text-uppercase">Mobile Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-secondary"></i></span>
                                <input type="tel" id="register-phone" class="form-control border-start-0" placeholder="+91 98765 43210">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register-password" class="form-label small fw-bold text-muted text-uppercase">Password * (Min 6 chars)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                                <input type="password" id="register-password" class="form-control border-start-0" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="register-confirm-password" class="form-label small fw-bold text-muted text-uppercase">Confirm Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                <input type="password" id="register-confirm-password" class="form-control border-start-0" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" id="register-btn" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3 shadow">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center small text-muted">
                        Already have an account? 
                        <a href="login.html" class="fw-bold text-primary text-decoration-none ms-1">Sign in here</a>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
